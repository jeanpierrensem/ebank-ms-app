spring.application.name=ebankMcpClient
server.port=8083
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false

spring.ai.openai.model=gpt-4o
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.mcp.client.streamable-http.connections.ebank-mcp-server-2.url=http://localhost:8082/mcp
spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8081/mcp

#Bot client API Key
telegram.token=${TELEGRAM_API_KEY}
eureka.client.jersey.enabled=false